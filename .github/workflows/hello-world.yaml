name: Hello World New

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.lock"
      - "newfolder/**.txt"
      - "!newfolder/**.md"

  pull_request:
    types: [opened, reopened, ready_for_review]

    paths:
      - "**.yaml"

jobs:
  say-hello-inline-bash:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello World from bash"
        shell: bash

  say-hello-inline-python:
    runs-on: ubuntu-24.04
    steps:
      - run: print("Hello World from python!")
        shell: python

  say-hello-action:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/hello-world-javascript-action@v1.1
        with:
          who-to-greet: "World from marketplace action"
    needs:
      - say-hello-inline-bash
      - say-hello-inline-python
